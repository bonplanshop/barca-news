<script>
const feed = "https://www.fcbarcelonanoticias.com/rss.html";

async function chargerActualites() {
  const zone = document.getElementById("news");

  try {
    const url = "https://api.rss2json.com/v1/api.json?rss_url=" +
                encodeURIComponent("https://www.fcbarcelonanoticias.com/feed/");

    const reponse = await fetch(url);
    const data = await reponse.json();

    if (!data.items || data.items.length === 0) {
      throw new Error("Aucune actualité");
    }

    zone.innerHTML = "";

    data.items.slice(0, 10).forEach(article => {
      const bloc = document.createElement("div");
      bloc.className = "article";

      const titre = document.createElement("h3");
      titre.textContent = article.title;

      const lien = document.createElement("a");
      lien.href = article.link;
      lien.target = "_blank";
      lien.rel = "noopener";
      lien.textContent = "Lire l'article";

      bloc.append(titre, lien);
      zone.appendChild(bloc);
    });
  } catch (erreur) {
    zone.textContent =
      "Impossible de charger les actualités pour le moment. Consulte le site officiel du Barça.";
  }
}

chargerActualites();
</script>
